<style>
:root{
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;--space-12:3rem;--space-16:4rem;
  --radius:12px;--radius-sm:8px;
  --font:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
:root{
  --bg:#ffffff;                 /* Redesign A (26.10.2026): reinweißer Hintergrund, weiße Flächen mit feinem Rand */
  --surface:#ffffff;            /* Kacheln, Antworten, Pillen */
  --surface-2:#f2f4f4;          /* neutrales Hellgrau: Hover, Buchstabenkreise, verschachtelte Flächen */
  --border:#d6e1de;             /* zarter Rand für Karten/Kacheln */
  --line:#b3c4c0;               /* sichtbarer Rand für Bedienelemente (1,8 : 1 gegen Weiß) */
  --text:#1c2b2f;
  --text-muted:#5b6d72;
  --accent:#29bca3;             /* Markentürkis (Logo) – Füllfarbe, Schrift darauf: --accent-text */
  --accent-soft:#e2f4f1;        /* „ausgewählt“ */
  --accent-ring:#1fa58f;
  --accent-text:#04342c;
  --accent-ink:#0b6b5b;         /* Türkis als Schriftfarbe auf Weiß (6,3 : 1) */
  --gold:oklch(72% .14 75);
  --ok:#29bca3;--ok-soft:#c8eee6;--ok-ink:#0b4a40;--on-ok:#04342c;           /* richtig = Türkis */
  --bad:#e58a7f;--bad-soft:#fcecea;--bad-ink:#94403a;--on-bad:#3d1410;      /* falsch = Rosé */
  --flag:oklch(70% .15 70);
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101b1e;
    --surface:#1a2b2e;
    --surface-2:#223538;
    --border:#26393c;
    --line:#36504f;
    --text:#e6efed;
    --text-muted:#9db1ad;
    --accent:#29bca3;
    --accent-soft:#173331;
    --accent-ring:#29bca3;
    --accent-text:#04342c;
    --accent-ink:#5fd3be;
    --gold:oklch(78% .13 75);
    --ok:#29bca3;--ok-soft:#163a34;--ok-ink:#8fe3d3;--on-ok:#04342c;
    --bad:#e9937e;--bad-soft:#3a2320;--bad-ink:#f2b3a5;--on-bad:#3d140b;
    --flag:oklch(78% .14 70);
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101b1e;
    --surface:#1a2b2e;
    --surface-2:#223538;
    --border:#26393c;
    --line:#36504f;
    --text:#e6efed;
    --text-muted:#9db1ad;
    --accent:#29bca3;
    --accent-soft:#173331;
    --accent-ring:#29bca3;
    --accent-text:#04342c;
    --accent-ink:#5fd3be;
    --gold:oklch(78% .13 75);
    --ok:#29bca3;--ok-soft:#163a34;--ok-ink:#8fe3d3;--on-ok:#04342c;
    --bad:#e9937e;--bad-soft:#3a2320;--bad-ink:#f2b3a5;--on-bad:#3d140b;
    --flag:oklch(78% .14 70);
    --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}   /* „hidden“ muss immer gewinnen – sonst überschreiben z. B. .btn{display:inline-flex} das Ausblenden */
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--text-base);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hwrap{max-width:1100px;margin:0 auto;padding:var(--space-3) var(--space-5);display:flex;align-items:center;gap:var(--space-4)}
.logo{display:flex;align-items:center;gap:var(--space-3);font-weight:600;font-size:var(--text-sm);letter-spacing:.01em}
.logo svg{width:32px;height:32px;flex:none}
.logo span small{display:block;font-weight:500;color:var(--text-muted);font-size:var(--text-xs)}
/* Logo + „Startseite“ als Home-Knopf; daneben Links zu den anderen Trainer-Apps */
.logo.home{background:none;border:0;padding:var(--space-1) var(--space-2) var(--space-1) 0;text-align:left;color:var(--text);cursor:pointer;border-radius:var(--radius-sm)}
/* Wort neben dem Logo und Links zu anderen Apps im Stil der PRINCE2-Wortmarke (Montserrat, Großbuchstaben, Türkis) */
.brand-word{font-family:'Montserrat',var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:17px;line-height:1;color:var(--brand,#29bca3);white-space:nowrap}
.logo .logo-img{height:28px;width:auto}
.logo.home{flex:none}
.logo.home:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.app-links{display:flex;gap:var(--space-2)}
.app-link{display:inline-flex;align-items:center;gap:5px;text-decoration:none;opacity:.5;transition:opacity .15s;padding:var(--space-1) 0}
.app-link:hover,.app-link:focus-visible{opacity:1}
.app-link svg{width:13px;height:13px;color:var(--brand,#29bca3)}
.app-links{margin-left:var(--space-3)}
.hspacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:var(--text-sm);padding:var(--space-1) var(--space-3);border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
.timer.warn{color:var(--bad-ink);border-color:var(--bad)}
.subhdr{border-top:1px solid var(--border)}
.subhdr:has(#timer[hidden]){display:none}
.swrap{max-width:1100px;margin:0 auto;padding:var(--space-2) var(--space-5);display:flex;gap:var(--space-2);align-items:flex-start}
.subhdr .timer{flex:1;min-width:0}
/* Pause: gleiche Höhe/Form wie die Leisten; während der Pause deckt ein undurchsichtiger Bildschirm die ganze App ab */
.pause-btn{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 var(--space-3);border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:var(--text-sm);font-weight:600;color:var(--text)}
.pause-btn:hover{border-color:var(--accent-ring);color:var(--accent-ink)}
.pause-btn svg{width:14px;height:14px}
.modal.pause{background:var(--bg);z-index:40}
.modal.pause .card{text-align:center;max-width:420px;border:1px solid var(--border)}
.modal.pause .pause-ico{width:56px;height:56px;margin:0 auto var(--space-4);border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.modal.pause .pause-ico svg{width:24px;height:24px}
.modal.pause .nav{justify-content:center}
/* Zeitanzeige = Stapel aus Leisten gleicher Form: Tempo (immer), Restzeit (nur Simulation) */
.subhdr .timer{display:grid;gap:6px;padding:0;border:0;border-radius:0;background:none;font-weight:500}
/* Simulation: Zeitleiste über die volle Breite, Füllung von links nach rechts, Restzeit mittig */
.tbar{position:relative;display:block;height:30px;padding:0;border:0;border-radius:999px;background:var(--surface-2);overflow:hidden;font-size:var(--text-sm);font-weight:500}
.tb-fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px 0 0 999px;transition:width 1s linear}
.tb-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.tb-lbl b{font-family:'Montserrat',var(--font);font-weight:600;margin-left:.35em}
.tb-lbl.on{color:var(--accent-text)}
.tbar.warn .tb-fill{background:var(--bad)}
.tbar.warn .tb-lbl.on{color:var(--on-bad)}
/* Ohne Simulation: gleiche Leistenform, darin Dauer · Tempo-Strich · Ø pro Frage */
.tbar.pace{display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-4)}
.pace .pv{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text-muted)}
.pace .pv b{font-family:'Montserrat',var(--font);font-weight:600;color:var(--text);margin-left:.25em}
.pace .pv-r b{color:var(--ok-ink)}
.pace.slow .pv-r b{color:var(--bad-ink)}
.pace-m{position:relative;flex:1;min-width:56px;height:6px;border-radius:999px;background:var(--border)}
.pace-m::after{content:"";position:absolute;left:50%;top:-5px;width:2px;height:16px;margin-left:-1px;border-radius:1px;background:var(--text-muted)}
.pace-f{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:999px;transition:left .6s,right .6s}
.pace.slow .pace-f{background:var(--bad)}
.pace-d{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);border:2px solid var(--surface-2);z-index:1;transition:left .6s}
.pace.slow .pace-d{background:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);transition:background .15s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}

main{max-width:1100px;margin:0 auto;padding:var(--space-8) var(--space-5) var(--space-16)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-5);border-radius:var(--radius-sm);font-weight:600;font-size:var(--text-sm);border:1px solid var(--border);background:var(--surface);transition:transform .12s,background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.flagged{border-color:var(--flag);color:var(--flag)}
.mode-badge{font-size:var(--text-xs);font-weight:600;padding:1px var(--space-2);border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}

/* Start */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:var(--space-10);align-items:start}
.eyebrow{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-ink);margin-bottom:var(--space-3)}
h1{font-size:var(--text-xl);line-height:1.15;font-weight:700;letter-spacing:-.015em;margin-bottom:var(--space-4)}
.lead{color:var(--text-muted);max-width:52ch;margin-bottom:var(--space-6)}
.lead.wide{max-width:none}                 /* Startseite: so breit wie Karten, Regler und Filter */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-bottom:var(--space-8)}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-4)}
.fact b{display:block;font-size:var(--text-lg);font-weight:700;letter-spacing:-.01em}
.fact span{font-size:var(--text-xs);color:var(--text-muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-6);box-shadow:var(--shadow)}
.card h2{font-size:var(--text-lg);font-weight:600;margin-bottom:var(--space-4)}
.opt-row{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--border)}
.opt-row:first-of-type{border-top:0}
.opt-row label:not(.switch){flex:1;cursor:pointer}
.opt-row label b{display:block;font-weight:600;font-size:var(--text-sm)}
.opt-row label span{font-size:var(--text-xs);color:var(--text-muted)}
.switch{position:relative;width:42px;height:24px;flex:0 0 42px;margin-top:2px;display:block}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px oklch(0% 0 0/.2)}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:2px solid var(--accent-ink);outline-offset:2px}
.topics{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-6)}
.chip{font-size:var(--text-xs);padding:var(--space-1) var(--space-3);border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted)}
.chip b{color:var(--text);font-weight:600}

/* Exam picker */
.picker{border:0;margin-bottom:var(--space-8)}
.picker legend{font-size:var(--text-sm);font-weight:600;margin-bottom:var(--space-3)}
.picker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}
.pick{position:relative;display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-4);border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s,transform .12s}
.pick:hover{border-color:var(--accent)}
.pick:active{transform:scale(.99)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick .dot{flex:none;width:20px;height:20px;margin-top:2px;border-radius:999px;border:2px solid var(--border);display:grid;place-items:center;transition:border-color .15s}
.pick .dot::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--accent);transform:scale(0);transition:transform .15s}
.pick b{display:block;font-weight:600;font-size:var(--text-sm)}
.pick small{display:block;font-size:var(--text-xs);color:var(--text-muted);margin-top:2px}
.pick .badge{display:inline-block;margin-top:var(--space-2);font-size:var(--text-xs);font-weight:600;padding:1px var(--space-2);border-radius:999px;background:var(--surface-2);color:var(--text-muted)}
.pick .badge.official{background:var(--accent-soft);color:var(--accent-ink)}
.pick:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.pick:has(input:checked) .dot{border-color:var(--accent)}
.pick:has(input:checked) .badge{background:var(--surface)}
.pick:has(input:checked) .dot::after{transform:scale(1)}
.pick:has(input:focus-visible){outline:2px solid var(--accent-ink);outline-offset:2px}
.picker + .picker{margin-top:calc(-1 * var(--space-3))}
.pick.mode{padding:var(--space-5) var(--space-4)}
.pick.mode b{font-size:var(--text-base)}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-2)}
.seg-opt{position:relative;cursor:pointer}
.seg-opt input{position:absolute;opacity:0;pointer-events:none}
.seg-opt span{display:grid;place-items:center;height:48px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
.seg-opt:hover span{border-color:var(--accent)}
.seg-opt input:checked + span{border-color:var(--accent);background:var(--accent);color:var(--accent-text)}
.seg-opt input:focus-visible + span{outline:2px solid var(--accent-ink);outline-offset:2px}
.seg-opt input:disabled + span{opacity:.45;cursor:not-allowed}
.seg.src{grid-template-columns:repeat(4,1fr)}
.cnt-slider output{display:block;font-family:'Montserrat',var(--font);font-weight:600;font-size:var(--text-lg);font-variant-numeric:tabular-nums;margin-bottom:var(--space-2)}
/* Schieberegler Fragenanzahl: Leiste links vom Griff gefüllt (--p), Rastmarken je Stufe; Griff 22 px → Marken 11 px eingerückt */
.cnt-slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer}
.cnt-slider input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(to right,var(--accent) 0 var(--p,0%),var(--border) var(--p,0%) 100%)}
.cnt-slider input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:linear-gradient(to right,var(--accent) 0 var(--p,0%),var(--border) var(--p,0%) 100%)}
.cnt-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--accent-ring),0 1px 3px rgb(0 0 0 / .2)}
.cnt-slider input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--accent-ring),0 1px 3px rgb(0 0 0 / .2)}
.cnt-slider input[type=range]:focus-visible{outline:none}
.cnt-slider input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 1.5px var(--accent-ring),0 0 0 5px var(--accent-soft)}
.cnt-slider input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 1.5px var(--accent-ring),0 0 0 5px var(--accent-soft)}
.cnt-ticks{display:flex;justify-content:space-between;padding:0 10px;margin-top:-2px}
.cnt-ticks i{width:2px;height:6px;border-radius:1px;background:var(--line)}
.cnt-scale{display:flex;justify-content:space-between;font-size:var(--text-xs);color:var(--text-muted);margin-top:2px}
.seg.topic{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.seg.topic .seg-opt span{height:auto;min-height:56px;padding:var(--space-2);text-align:center;font-size:var(--text-xs);line-height:1.3;gap:2px}
.seg.topic .seg-opt span small{display:block;font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.seg.src .seg-opt span{height:auto;min-height:56px;padding:var(--space-2);text-align:center;font-size:var(--text-xs);line-height:1.3;gap:2px}
.seg.src .seg-opt span small{display:block;font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.opt-row.info{align-items:center}
.opt-row.info > span:last-child b{display:block;font-weight:600;font-size:var(--text-sm)}
.opt-row.info > span:last-child span{font-size:var(--text-xs);color:var(--text-muted)}
.info-icon{flex:0 0 42px;height:24px;display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.time-note{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-3)}
.timer small{font-weight:500;color:var(--text-muted);margin-right:var(--space-1)}
.expl p{white-space:pre-line}
.load-note{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-3);text-align:center}
.load-note.err{color:var(--bad-ink)}

/* Exam layout */
.exam{display:grid;grid-template-columns:1fr 260px;gap:var(--space-8);align-items:start}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:var(--space-6)}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.qmeta{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.qnum{font-weight:700;font-size:var(--text-sm);color:var(--accent-ink)}
.qtopic{font-size:var(--text-xs);color:var(--text-muted)}
.btn.small{padding:var(--space-1) var(--space-3);font-size:var(--text-xs)}
.scen-btn{margin-left:auto}
.scen-btn.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.focus-badge{font-size:var(--text-xs);font-weight:600;padding:1px var(--space-2);border-radius:999px;background:var(--bad-soft);color:var(--bad-ink)}
.scenario{white-space:pre-line}
.group-intro{font-size:var(--text-sm)}
.group-pos{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);margin-bottom:var(--space-2)}
.expl .letter.multi{width:auto;min-width:26px;padding:0 var(--space-2)}

/* Szenario-Panel: Desktop = Seitenleiste rechts (Inhalt rückt nach links), Handy = Overlay */
.scen-panel{position:fixed;top:var(--hdr,61px);right:0;bottom:0;width:min(420px,38vw);z-index:9;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 24px oklch(0% 0 0/.08);overflow-y:auto;overscroll-behavior:contain;outline:none}
.scen-panel[hidden]{display:none}
body.scen-open{padding-right:min(420px,38vw)}
.scen-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-5);background:var(--surface);border-bottom:1px solid var(--border)}
.scen-body{padding:var(--space-4) var(--space-5) var(--space-8);font-size:var(--text-sm);line-height:1.6}
.scen-body p{margin-bottom:var(--space-3)}
.scen-body h3{font-size:var(--text-base);margin:var(--space-6) 0 var(--space-2);padding-top:var(--space-4);border-top:1px solid var(--border)}
.scen-body h4{font-size:var(--text-sm);margin:var(--space-3) 0 var(--space-1)}
.scen-body ul{margin:0 0 var(--space-3) var(--space-5)}
.scen-body dt{font-weight:700;margin-top:var(--space-3)}
.scen-body dd{margin:0;color:var(--text)}
@media (max-width:1300px){
  body.scen-open .exam{grid-template-columns:1fr}
  body.scen-open .side{position:static;padding-top:var(--space-6);border-top:1px solid var(--border)}
  body.scen-open .grid{grid-template-columns:repeat(10,1fr)}
}
.scenario{background:var(--surface-2);border-left:3px solid var(--accent);padding:var(--space-3) var(--space-4);border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:var(--space-4);color:var(--text)}
.qtext{font-size:var(--text-lg);font-weight:600;line-height:1.35;letter-spacing:-.01em;margin-bottom:var(--space-5)}
.items{list-style:none;margin:0 0 var(--space-5);display:grid;gap:var(--space-2)}
.items li{display:flex;gap:var(--space-3);padding:var(--space-2) var(--space-3);background:var(--surface-2);border-radius:var(--radius-sm);font-size:var(--text-sm)}
.items li b{color:var(--accent-ink);flex:none;min-width:1.2em}
.options{display:grid;gap:var(--space-3)}
.opt{display:flex;align-items:flex-start;gap:var(--space-4);width:100%;text-align:left;padding:var(--space-4) var(--space-5);border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);transition:border-color .15s,background .15s,transform .12s;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.995)}
.opt:disabled{cursor:default}
.opt .letter{flex:none;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:var(--text-sm);background:var(--surface-2);border:1px solid var(--border)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);color:var(--on-ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.selected .letter{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.opt.selected .tag{color:var(--accent-ink)}
.opt .tag{margin-left:auto;flex:none;font-size:var(--text-xs);font-weight:600;align-self:center}
.opt.correct .tag{color:var(--ok-ink)}.opt.wrong .tag{color:var(--bad-ink)}

/* Feedback */
.feedback{margin-top:var(--space-6);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-5);font-weight:600}
.fb-head.ok{background:var(--ok-soft);color:var(--ok-ink)}
.fb-head.bad{background:var(--bad-soft);color:var(--bad-ink)}
.fb-head svg{width:22px;height:22px;flex:none}
.fb-body{padding:var(--space-5);background:var(--surface);display:grid;gap:var(--space-4)}
.fb-body h3{font-size:var(--text-sm);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
.expl{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);background:var(--surface-2);font-size:var(--text-sm);line-height:1.55}
.expl .letter{flex:none;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:var(--text-xs);background:var(--surface);border:1px solid var(--border)}
.expl.right{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.expl.mine{border:1.5px solid var(--bad)}  /* eigene falsche Antwort: gleiche Stärke wie .opt.wrong */
.expl.right .letter{background:var(--ok);color:var(--on-ok);border-color:var(--ok)}
.expl .verdict{font-weight:600;display:block;margin-bottom:2px}
.expl.right .verdict{color:var(--ok-ink)}
.expl.other .verdict{color:var(--bad-ink)}
.expl p{color:var(--text)}
.ref{font-size:var(--text-xs);color:var(--text-muted);display:flex;gap:var(--space-4);flex-wrap:wrap}
.ref code{font-family:ui-monospace,Menlo,monospace;background:var(--surface-2);padding:1px 6px;border-radius:4px}
.nav{display:flex;gap:var(--space-3);margin-top:var(--space-6);flex-wrap:wrap}
.nav .spacer{flex:1}
.nav.top{margin:0 0 var(--space-5);padding-bottom:var(--space-4);border-bottom:1px solid var(--border)}

/* Sidebar grid */
.side{position:sticky;top:76px}
.side h2{font-size:var(--text-sm);font-weight:600;margin-bottom:var(--space-3);display:flex;justify-content:space-between}
.side h2 span{color:var(--text-muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:var(--text-xs);font-weight:600;display:grid;place-items:center;position:relative;transition:transform .1s}
.cell:hover{transform:scale(1.08)}
.cell.cur{outline:2px solid var(--accent-ink);outline-offset:1px}
.cell.ok{background:var(--ok);color:var(--on-ok);border-color:var(--ok)}
.cell.bad{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.cell.done{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.cell.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:999px;background:var(--flag);border:1.5px solid var(--bg)}
.legend{display:grid;gap:var(--space-1);margin-top:var(--space-4);font-size:var(--text-xs);color:var(--text-muted)}
.legend span{display:flex;align-items:center;gap:var(--space-2)}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--border);display:inline-block}
.side .btn{width:100%;justify-content:center;margin-top:var(--space-4)}

/* Result */
.result-head{display:grid;grid-template-columns:auto 1fr;gap:var(--space-8);align-items:center;margin-bottom:var(--space-8)}
.ring{width:170px;height:170px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:var(--ok);transition:stroke-dashoffset 1s ease-out}
.ring.fail .val{stroke:var(--bad)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .num b{font-size:var(--text-xl);font-weight:700;letter-spacing:-.02em}
.ring .num span{font-size:var(--text-xs);color:var(--text-muted)}
.verdict-big{font-size:var(--text-xl);font-weight:700;letter-spacing:-.015em;margin-bottom:var(--space-2)}
.verdict-big.ok{color:var(--ok-ink)}.verdict-big.bad{color:var(--bad-ink)}
.topic-list{display:grid;gap:var(--space-3)}
.topic-row{display:grid;grid-template-columns:200px 1fr 60px;gap:var(--space-4);align-items:center;font-size:var(--text-sm)}
.topic-row .bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.topic-row .bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.topic-row .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.review{display:grid;gap:var(--space-3);margin-top:var(--space-6)}
.rv{display:flex;gap:var(--space-4);align-items:flex-start;width:100%;text-align:left;padding:var(--space-4);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:var(--text-sm)}
.rv:hover{border-color:var(--accent)}
.rv .n{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff}
.rv .n.bad{background:var(--bad)}.rv .n.ok{background:var(--ok)}.rv .n.skip{background:var(--text-muted)}
.rv small{display:block;color:var(--text-muted);margin-top:2px}
.section-title{font-size:var(--text-lg);font-weight:600;margin:var(--space-10) 0 var(--space-4)}
footer{max-width:1100px;margin:0 auto;padding:var(--space-6) var(--space-5);font-size:var(--text-xs);color:var(--text-muted);border-top:1px solid var(--border)}

/* Modal */
.modal{position:fixed;inset:0;background:oklch(0% 0 0/.5);display:grid;place-items:center;padding:var(--space-5);z-index:20}
.modal .card{max-width:460px;width:100%}
.modal p{color:var(--text-muted);margin-bottom:var(--space-5);font-size:var(--text-sm)}
.modal .nav{margin-top:0}


/* Lernfortschritt */
.nav-btn{padding:var(--space-2) var(--space-3)}
.nav-btn svg{width:18px;height:18px}
.nav-btn.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.btn.danger{color:var(--bad-ink);border-color:color-mix(in srgb,var(--bad) 45%,var(--border))}
.btn.primary.danger{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.notice{background:var(--accent-soft);color:var(--text);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5);font-size:var(--text-sm)}
.filters{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-5)}
.seg.small{display:inline-grid;grid-auto-flow:column;grid-template-columns:none;gap:var(--space-1)}
.seg.small .seg-opt span{height:36px;padding:0 var(--space-3);font-weight:600;font-size:var(--text-xs)}
.facts.four{grid-template-columns:repeat(4,1fr);margin-bottom:0}
.facts.five{grid-template-columns:repeat(5,1fr);margin-bottom:0}
.fact{position:relative}
/* „?“ oben rechts in der Kachel; Abstand zum Rand wie das Kachel-Padding (oben etwas weniger, optisch auf Höhe der Zahl) */
.tip{position:static}
.fact .tip-btn{position:absolute;top:var(--space-3);right:var(--space-3)}
.tip-btn{width:20px;height:20px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);font-size:11px;font-weight:700;line-height:1;display:inline-grid;place-items:center;cursor:help;padding:0}
.tip-btn:hover,.tip.open .tip-btn{border-color:var(--accent);color:var(--accent-ink)}
.fact:has(.tip) b{padding-right:var(--space-6)}
.tip-text{display:none;position:absolute;left:var(--space-2);right:var(--space-2);top:calc(100% - var(--space-2));z-index:5;padding:var(--space-3);border-radius:var(--radius-sm);background:var(--text);color:var(--surface);font-size:var(--text-xs);line-height:1.45;box-shadow:0 8px 24px oklch(0% 0 0/.18);text-align:left}
.fact span.tip-text{color:var(--surface)}
.tip:hover .tip-text,.tip-btn:focus-visible + .tip-text,.tip.open .tip-text{display:block}

/* Trainings-Filter: eingeklappt nur Kopfzeile; aufgeklappt je Kategorie Überschrift + eine Zeile kompakter Chips */
.filter{margin:calc(var(--space-2) * -1) 0 var(--space-6);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.filter-head{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;width:100%;padding:var(--space-3) var(--space-4);text-align:left;cursor:pointer;border-radius:16px;transition:background .15s}
.filter-head:hover{background:var(--surface-2)}
.filter.open .filter-head{border-radius:16px 16px 0 0}
.filter-head:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.fh-title{font-family:'Montserrat',var(--font);font-size:var(--text-sm);font-weight:700;display:inline-flex;align-items:center;gap:var(--space-2)}
/* Pfeil neben „Filter“: zeigt nach unten (eingeklappt) bzw. dreht sich nach oben (aufgeklappt) */
.fh-chev{width:18px;height:18px;color:var(--accent-ink);transition:transform .2s}
.filter.open .fh-chev{transform:rotate(180deg)}
.filter-reset{display:flex;justify-content:flex-end;padding-top:var(--space-3)}
.filter-sum{font-size:var(--text-xs);font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:2px var(--space-2);border-radius:999px}
.linkbtn{background:none;border:0;padding:0;font-size:var(--text-xs);color:var(--text-muted);text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:var(--accent-ink)}
.filter-body{display:grid;gap:var(--space-4);padding:var(--space-1) var(--space-4) var(--space-4);border-top:1px solid var(--border)}
.filter > .time-note{padding:0 var(--space-4) var(--space-3);margin:0}
.frow{position:relative;padding-top:var(--space-3)}
.frow-head{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:var(--space-2);display:flex;align-items:center;gap:var(--space-2)}
.frow-head .tip{margin:0}
.frow .tip-text{left:0;right:auto;width:min(320px,100%);top:calc(var(--space-3) + 24px);text-transform:none;letter-spacing:normal;font-weight:400}
.fchips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.fchip{position:relative;cursor:pointer}
.fchip input{position:absolute;opacity:0;pointer-events:none}
.fchip span{display:inline-flex;align-items:baseline;gap:6px;padding:5px var(--space-3);border:1.5px solid var(--border);border-radius:999px;background:var(--surface);font-size:var(--text-sm);font-weight:600;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s}
.fchip span small{font-size:var(--text-xs);font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}
.fchip:hover span{border-color:var(--accent)}
.fchip input:checked + span{border-color:var(--accent);background:var(--accent);color:var(--accent-text)}
.fchip input:checked + span small{color:inherit;opacity:.8}
.fchip input:focus-visible + span{outline:2px solid var(--accent-ink);outline-offset:2px}
.fchip input:disabled + span{opacity:.45;cursor:not-allowed}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--text-muted);font-size:11px;font-family:var(--font)}
.chart-legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-5);margin-top:var(--space-3)}
.lg-pass{border:0!important;border-top:2px dashed var(--ok)!important;height:0!important;width:18px!important;border-radius:0!important}
.chart .passline{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:6 5}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .dot-ok{fill:var(--ok);stroke:var(--surface);stroke-width:2}
.chart .dot-bad{fill:var(--bad);stroke:var(--surface);stroke-width:2}
.errcard{display:flex;align-items:center;gap:var(--space-4);justify-content:space-between;margin-top:var(--space-6);flex-wrap:wrap}
.errcard b{display:block;font-size:var(--text-lg)}
.errcard span{font-size:var(--text-sm);color:var(--text-muted)}
.runs{display:grid;gap:var(--space-2)}
.run{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);flex-wrap:wrap}
.run .n{flex:none;min-width:52px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:var(--text-sm);color:#fff;font-variant-numeric:tabular-nums}
.run .n.ok{background:var(--ok)}.run .n.bad{background:var(--bad)}
.run-main{flex:1;min-width:0;font-size:var(--text-sm)}
.run-main small{display:block;color:var(--text-muted)}
.run-actions{display:flex;gap:var(--space-2)}
.run-actions .btn{padding:var(--space-2) var(--space-3)}
.rv.static{cursor:default}.rv.static:hover{border-color:var(--border)}
.rv .n{min-width:34px;width:auto;padding:0 var(--space-1)}
.card.empty,.card.backup{margin-top:var(--space-6)}
.card.backup .nav{margin-top:var(--space-4)}
/* Anmeldemaske */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:var(--space-5);overflow:auto}
.gate .card{width:100%;max-width:380px;text-align:center;border:1px solid var(--border);background:var(--surface)}
.gate-logo{display:block;margin:0 auto var(--space-4);height:28px;width:auto}
.gate h1{font-size:var(--text-lg);margin-bottom:var(--space-2)}
.gate p{color:var(--text-muted);font-size:var(--text-sm)}
.gate-label{display:block;text-align:left;font-weight:600;font-size:var(--text-sm);margin:var(--space-5) 0 var(--space-2)}
.gate input{width:100%;font:inherit;font-size:var(--text-base);padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text)}
.gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gate-err{color:var(--bad-ink);margin-top:var(--space-3);text-align:left}
.gate .btn{width:100%;justify-content:center;margin-top:var(--space-5)}
.gate-wait{color:var(--text-muted);font-size:var(--text-sm);text-align:center;max-width:380px}
/* Sicherung: Hinweis auf der Ergebnisseite, Bereich im Pause-Fenster, Bestätigung nach dem Herunterladen */
.backup-hint{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;margin-top:var(--space-6);padding:var(--space-4) var(--space-5);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.backup-hint p{flex:1 1 280px;margin:0;font-size:var(--text-sm);color:var(--text-muted)}
.backup-hint p b{display:block;color:var(--text);margin-bottom:2px}
.pause-backup{margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--border)}
.pause-backup .time-note{margin-top:var(--space-2)}
.backup-done{display:inline-flex;align-items:center;min-height:40px;font-weight:600;color:var(--accent-ink)}
@media (max-width:900px){
  /* Kopfzeile bis 900 px: Lernfortschritt nur als Symbol; weitere Stufen siehe „Kopfzeile stufenweise“ am Ende */
  .nav-btn span{display:none}
  .facts.five{grid-template-columns:repeat(3,1fr)}
  .scen-panel{width:100%;left:0;border-left:0;box-shadow:none}
  body.scen-open{padding-right:0;overflow:hidden}
  .hero{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .side{position:static;padding-top:var(--space-6);border-top:1px solid var(--border)}
  .grid{grid-template-columns:repeat(10,1fr)}
  .result-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .topic-row{grid-template-columns:1fr 60px}.topic-row .bar{grid-column:1/-1}
}
@media (max-width:520px){
  .facts{grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
  .fact{padding:var(--space-3)}
  .fact b{font-size:var(--text-base)}
  .picker-grid{grid-template-columns:1fr}

}
}

/* ===== Redesign A „hell und luftig“ (26.10.2026) =====

   Steht bewusst am Ende: überschreibt die Grundformen oben, ohne sie einzeln umzubauen. */

.pick{background:var(--surface);border-radius:16px}

<body>
<!-- Anmeldemaske (Passwortschutz, Protokoll Eintrag 63): Bis zur richtigen Eingabe werden weder config.js/app.js noch Fragen
     geladen. Die Fragen liegen nur verschlüsselt vor (data/inhalt.enc.json, AES-256-GCM, Schlüssel per PBKDF2 aus dem Passwort,
     erzeugt mit tools/verschluesseln.mjs); das Passwort selbst steht nirgends im Code. Das Gerät merkt sich den abgeleiteten
     Schlüssel (p2p-unlock), damit nicht bei jedem Öffnen neu eingegeben werden muss. -->
<div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <form class="card" id="gateForm" hidden>
    <img src="img/logo-prince2.png" alt="" width="152" height="28" class="gate-logo">
    <h1 id="gateTitle">Practitioner Trainer</h1>
    <p>Der Zugang ist geschützt. Bitte gib das Passwort ein.</p>
    <label for="gatePw" class="gate-label">Passwort</label>
    <input type="password" id="gatePw" autocomplete="current-password" required>
    <p class="gate-err" id="gateErr" role="alert" hidden></p>
    <button class="btn primary" id="gateBtn" type="submit">Öffnen</button>
  </form>
  <p class="gate-wait" id="gateWait">Wird geladen …</p>
</div>
<header>
  <div class="hwrap">
    <button type="button" class="logo home" id="homeLogo" title="Zur Startseite" aria-label="Zur Startseite">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M9 23V9h7a4.5 4.5 0 010 9h-4.5" stroke="var(--accent-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="22" r="2.2" fill="var(--gold)"/></svg>
      <span class="brand-word" id="brandWord"></span>
    </button>
    <nav id="appLinks" class="app-links" aria-label="Weitere Trainer"></nav>
    <div class="hspacer"></div>
    <button class="btn nav-btn" id="progressBtn" aria-label="Lernfortschritt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="M6 15l4-5 4 3 5-7"/></svg>
      <span>Lernfortschritt</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Farbschema wechseln">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
  <!-- Unterzeile: Zeitanzeige während einer laufenden Prüfung/Übung (ausgeblendet, solange der Timer verborgen ist) -->
  <div class="subhdr"><div class="swrap">
    <button type="button" class="pause-btn" id="pauseBtn" title="Pausieren – die Zeit stoppt" aria-label="Pausieren"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg><span>Pause</span></button>
    <div id="timer" class="timer" hidden>60:00</div>
  </div></div>
</header>

<main id="app" aria-live="polite"></main>
<aside id="scenPanel" class="scen-panel" tabindex="-1" aria-label="Szenario" hidden></aside>

<footer><span id="footSource"></span> PRINCE2® ist eine eingetragene Marke von PeopleCert. Diese interaktive Umsetzung dient ausschließlich dem persönlichen Lernen.</footer>

<script>
(() => {
  // Versionsparameter bei jeder Änderung an config.js bzw. app.js erhöhen: neue index.html lädt garantiert die passenden Dateien
  const V = '?v=53', KEY = 'p2p-unlock', LOCK = 'p2p-gate', TRIES = 3, LOCK_MS = 24 * 3600 * 1000;
  const $ = id => document.getElementById(id), form = $('gateForm'), err = $('gateErr'), btn = $('gateBtn');
  const rest = [...document.querySelectorAll('body > header, body > main, body > aside, body > footer')];
  rest.forEach(e => e.inert = true);
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const store = { get(){ try { return localStorage.getItem(KEY); } catch(e) { return null; } },
                  set(v){ try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch(e) {} } };
  // Sperre nach 3 Fehlversuchen für 24 h – nur in diesem Browser (ohne Server nicht anders möglich); bremst Ausprobieren in der Maske
  const lock = { get(){ try { return JSON.parse(localStorage.getItem(LOCK)) || { fails: 0 }; } catch(e) { return { fails: 0 }; } },
                 set(v){ try { v ? localStorage.setItem(LOCK, JSON.stringify(v)) : localStorage.removeItem(LOCK); } catch(e) {} } };
  const lockedUntil = () => { const l = lock.get(); return l.until && l.until > Date.now() ? l.until : 0; };
  const fmtUntil = ms => new Date(ms).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  let enc = null;
  const decrypt = async key => JSON.parse(new TextDecoder().decode(
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(enc.iv) }, key, unb64(enc.data))));
  const showForm = msg => {
    $('gateWait').hidden = true; form.hidden = false; btn.textContent = 'Öffnen';
    const until = lockedUntil();
    if(until) msg = `Zu viele Fehlversuche. Erneut möglich am ${fmtUntil(until)} Uhr.`;
    btn.disabled = $('gatePw').disabled = !!until;
    err.hidden = !msg; err.textContent = msg || ''; if(!until) $('gatePw').focus();
  };
  function boot(data){
    window.APP_DATA = data;
    $('gate').remove(); rest.forEach(e => e.inert = false);
    ['config.js', 'app.js'].reduce((p, f) => p.then(() => new Promise((ok, no) => {
      const s = document.createElement('script'); s.src = f + V; s.onload = ok; s.onerror = no; document.body.appendChild(s);
    })), Promise.resolve());
  }
  form.onsubmit = async e => {
    e.preventDefault();
    if(lockedUntil()) return showForm();
    btn.disabled = true; btn.textContent = 'Prüfe …'; err.hidden = true;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('gatePw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(enc.salt), iterations: enc.iter },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      let data;
      try { data = await decrypt(key); } catch(x) {
        const l = lock.get(), fails = (l.fails || 0) + 1;
        lock.set(fails >= TRIES ? { fails: 0, until: Date.now() + LOCK_MS } : { fails });
        $('gatePw').value = '';
        const left = TRIES - fails;
        return showForm(`Das Passwort ist nicht richtig. Noch ${left} ${left === 1 ? 'Versuch' : 'Versuche'}.`);
      }
      lock.set(null);
      store.set(b64(await crypto.subtle.exportKey('raw', key)));
      boot(data);
    } catch(x) { showForm('Das hat nicht geklappt. Bitte erneut versuchen.'); }
  };
  (async () => {
    if(!window.crypto?.subtle){ $('gateWait').textContent = 'Dieser Browser unterstützt die nötige Verschlüsselung nicht. Bitte einen aktuellen Browser verwenden.'; return; }
    try {
      const r = await fetch('data/inhalt.enc.json', { cache: 'no-cache' });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      enc = await r.json();
    } catch(x) { $('gateWait').textContent = 'Die Inhalte konnten nicht geladen werden. Bitte die Seite neu laden.'; return; }
    const saved = store.get();
    if(saved){
      try {
        const key = await crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', false, ['decrypt']);
        return boot(await decrypt(key));
      } catch(x) { store.set(null); }                   // Passwort inzwischen geändert → neu anmelden
    }
    showForm();
  })();
})();
</script>
</body>
</html>
